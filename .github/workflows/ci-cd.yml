name: CI-CD Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  auth-history-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: legal
          POSTGRES_DB: legal_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal -d legal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install account test dependencies
        run: python -m pip install fastapi httpx pytest streamlit requests 'SQLAlchemy>=2.0,<3' 'psycopg[binary]>=3.2,<4'
      - name: Test login and history screens
        run: python -m pytest tests/test_auth_frontend.py -p no:cacheprovider
      - name: Test cache isolation and outage fallback
        run: python -m pytest tests/test_answer_cache.py -p no:cacheprovider
      - name: Test PostgreSQL storage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://legal:ci-test-only@localhost:5432/legal_test
        run: python -m pytest tests/test_auth_history.py -p no:cacheprovider

  build-test-push:
    needs: auth-history-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set image tag
        id: vars
        run: echo "tag=$(TZ='Asia/Kolkata' date +%Y-%m-%d_%H-%M-%S)" >> $GITHUB_OUTPUT
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          load: true
          tags: chitranganalaxkar/legal-chatbot-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          load: true
          tags: chitranganalaxkar/legal-chatbot-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke test - backend starts and responds
        run: |
          docker network create smoke-network
          trap 'docker rm -f test-backend test-postgres >/dev/null 2>&1 || true; docker network rm smoke-network >/dev/null 2>&1 || true' EXIT
          docker run -d --name test-postgres --network smoke-network \
            --env POSTGRES_USER=legal --env POSTGRES_DB=legal_smoke \
            --env POSTGRES_PASSWORD=ci-smoke-only postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec test-postgres pg_isready -U legal -d legal_smoke; then break; fi
            sleep 2
          done
          docker run -d --name test-backend \
            --network smoke-network \
            -p 8000:8000 \
            -v ${{ github.workspace }}/backend/data:/app/backend/data \
            --env GEMINI_API_KEY=dummy-key-for-smoke-test \
            --env DATABASE_URL=postgresql+psycopg://legal:ci-smoke-only@test-postgres:5432/legal_smoke \
            --env ENABLE_ANSWER_CACHE=false \
            chitranganalaxkar/legal-chatbot-backend:latest
          # Cold start loads the embedding model, FAISS index, and builds a
          # BM25 index over ~3,000 sections inside FastAPI's lifespan hook -
          # no request (not even /health) is served until that finishes, and
          # a fixed short sleep isn't reliable. Poll instead, up to 2 minutes.
          healthy=false
          for i in $(seq 1 24); do
            if curl --fail --silent http://localhost:8000/health | grep -Eq '"index_loaded":[[:space:]]*true'; then
              echo "Backend is up."
              healthy=true
              break
            fi
            echo "Waiting for backend to become healthy... ($i/24)"
            sleep 5
          done
          if [ "$healthy" != "true" ]; then
            echo "Backend did not become healthy in time."
            docker logs test-backend
            docker stop test-backend
            exit 1
          fi
          docker stop test-backend
      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            chitranganalaxkar/legal-chatbot-backend:latest
            chitranganalaxkar/legal-chatbot-backend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            chitranganalaxkar/legal-chatbot-frontend:latest
            chitranganalaxkar/legal-chatbot-frontend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Legal-Chatbot
            git pull origin main
            python3 backend/scripts/prepare_deployment_env.py
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 24); do
              if curl --fail --silent http://localhost/api/health | grep -Eq '"index_loaded":[[:space:]]*true'; then
                echo "Backend is up (via nginx)."
                exit 0
              fi
              echo "Waiting for backend to become healthy... ($i/24)"
              sleep 5
            done
            echo "Backend did not become healthy after deploy."
            docker logs legal-chatbot-backend --tail 100
            docker logs legal-chatbot-nginx --tail 100
            exit 1
