# Production Docker Compose Configuration
#
# This file uses the pre-built Docker images published on Docker Hub
# instead of building them locally.
#
# Usage:
# docker compose -f docker-compose.prod.yml up
#
# Make sure to create a .env file (from .env.example) and set
# your GEMINI_API_KEY before running.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: legal
      POSTGRES_DB: legal_chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the EC2 .env before deploying}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: chitranganalaxkar/legal-chatbot-backend:latest
    container_name: legal-chatbot-backend
    volumes:
      - ./backend/data:/app/backend/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://legal:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the EC2 .env before deploying}@postgres:5432/legal_chatbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: chitranganalaxkar/legal-chatbot-frontend:latest
    container_name: legal-chatbot-frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: legal-chatbot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
